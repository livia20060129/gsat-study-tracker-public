<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f8fc" />
  <link rel="icon" type="image/png" href="./book.png" />
  <link rel="apple-touch-icon" href="./book.png" />
  <title>待辦事項｜每日讀書完成度紀錄卡</title>
</head>
<body>
  <main class="todo-page">
    <header class="todo-page-header">
      <div>
        <h1>待辦事項</h1>
        <p>直接查看並完成舊日期的排程，不必回原日期尋找紀錄卡。</p>
      </div>
      <a class="todo-back header-action-link" href="./index.html">回到 Tracker</a>
    </header>

    <section class="todo-panel" aria-labelledby="todoTitle">
      <div class="todo-panel-head">
        <div>
          <h2 id="todoTitle">逾期未完成</h2>
          <p id="recordSource">正在讀取本機紀錄…</p>
        </div>
        <button id="refreshTodo" type="button">重新讀取</button>
      </div>

      <div class="todo-panel-body">
        <div class="subject-switch" id="subjectSwitch" role="tablist" aria-label="依科目篩選待辦事項" data-active="0">
          <span class="subject-switch-indicator" aria-hidden="true"></span>
          <button type="button" role="tab" data-subject="all" aria-selected="true">全部</button>
          <button type="button" role="tab" data-subject="chinese" aria-selected="false" tabindex="-1">國文</button>
          <button type="button" role="tab" data-subject="english" aria-selected="false" tabindex="-1">英文</button>
          <button type="button" role="tab" data-subject="math" aria-selected="false" tabindex="-1">數學</button>
          <button type="button" role="tab" data-subject="natural" aria-selected="false" tabindex="-1">自然</button>
          <button type="button" role="tab" data-subject="other" aria-selected="false" tabindex="-1">其他</button>
        </div>

        <div class="todo-summary">
          <strong id="todoSummary"></strong>
          <span>時間、計時與進度會直接回寫原紀錄；「跳過」不會視為完成。</span>
        </div>

        <div id="todoList" class="todo-list" role="tabpanel"></div>
        <p id="todoEmpty" class="todo-empty" hidden>目前沒有符合條件的待辦事項。</p>
        <div id="todoFeedback" class="todo-feedback" role="status" aria-live="polite" hidden>
          <span id="todoFeedbackText"></span>
        </div>
        <p id="todoError" class="todo-error" role="alert" hidden></p>
      </div>
    </section>

    <section class="todo-panel todo-history-panel" aria-labelledby="todoHistoryTitle">
      <div class="todo-panel-head">
        <div>
          <h2 id="todoHistoryTitle">最近處理</h2>
          <p>完成或跳過的項目可在 3 天內復原；超過 72 小時會自動從此清單移除。</p>
        </div>
        <strong id="todoHistoryCount">0 項可復原</strong>
      </div>
      <div class="todo-panel-body">
        <div id="todoHistoryList" class="todo-history-list"></div>
        <p id="todoHistoryEmpty" class="todo-empty">目前沒有可復原的項目。</p>
      </div>
    </section>
  </main>
  <script type="module" src="/src/todo-page.ts"></script>
</body>
</html>
