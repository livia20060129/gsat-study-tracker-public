<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./page-transitions.js?v=171.6.0-public.48"></script>
  <meta name="theme-color" content="#f5f8fc" />
  <link rel="icon" type="image/png" href="./book.png" />
  <link rel="apple-touch-icon" href="./book.png" />
  <title>待辦事項｜GSAT Study Tracker</title>
</head>
<body>
  <main class="todo-page">
    <header class="todo-page-header page-navigation-header">
      <div>
        <h1>待辦事項</h1>
        <p class="todo-source-line"><span id="recordSource">正在讀取本機紀錄…</span><a id="refreshTodo" href="./todo.html">重新讀取</a></p>
      </div>
      <div class="page-navigation-actions"><a class="todo-back header-action-link" data-navigation="home" href="./index.html">回到 Tracker</a></div>
    </header>

    <section class="todo-panel study-record-section" aria-label="逾期未完成">
      <div class="todo-panel-body">
        <div class="todo-period-filter">
          <div class="period-switch" id="periodSwitch" role="group" aria-label="依期間篩選待辦事項" data-active="0">
            <span class="period-switch-indicator" aria-hidden="true"></span>
            <button type="button" data-period="all" aria-pressed="true">全部</button>
            <button type="button" data-period="month" aria-pressed="false">本月</button>
            <button type="button" data-period="week" aria-pressed="false">本週</button>
          </div>
          <p id="todoPeriodRange">依原排程日期篩選</p>
        </div>
        <div class="subject-switch" id="subjectSwitch" role="tablist" aria-label="依科目篩選待辦事項" data-active="0">
          <span class="subject-switch-indicator" aria-hidden="true"></span>
          <button type="button" role="tab" data-subject="all" aria-selected="true">全部</button>
          <button type="button" role="tab" data-subject="chinese" aria-selected="false" tabindex="-1">國文</button>
          <button type="button" role="tab" data-subject="english" aria-selected="false" tabindex="-1">英文</button>
          <button type="button" role="tab" data-subject="math" aria-selected="false" tabindex="-1">數學</button>
          <button type="button" role="tab" data-subject="natural" aria-selected="false" tabindex="-1">自然</button>
          <button type="button" role="tab" data-subject="other" aria-selected="false" tabindex="-1">其他</button>
        </div>

        <div class="todo-item-filter">
          <label for="todoItemFilter">查看項目</label>
          <select id="todoItemFilter" aria-controls="todoList" aria-describedby="todoItemFilterHint">
            <option value="">全部項目</option>
          </select>
          <p id="todoItemFilterHint">同一教材的不同回次、單元一併顯示，並依目前科目及期間篩選。</p>
        </div>

        <div class="todo-summary" role="status" aria-live="polite">
          <strong id="todoSummary"></strong>
          <span>時間、計時與進度會直接回寫原紀錄；「跳過」不會視為完成。</span>
        </div>

        <div class="todo-organization-tools">
          <label for="todoSort">逾期排序<select id="todoSort"><option value="oldest">最久在前</option><option value="newest">最近在前</option></select></label>
          <button type="button" id="todoBatchSkip" disabled>先選擇科目以批次跳過</button>
          <p>近期待辦與長期逾期各自依此排序；批次跳過依目前科目、期間與查看項目篩選。</p>
        </div>

        <div id="todoList" role="tabpanel">
          <div id="todoRecentList" class="todo-list"></div>
          <details id="todoLongTerm" class="todo-long-term" hidden><summary><strong>長期逾期</strong><span id="todoLongTermCount"></span></summary><p>原排程超過 30 天，進度與計時資料仍保留。</p><div id="todoLongTermList" class="todo-list"></div></details>
        </div>
        <p id="todoEmpty" class="todo-empty" hidden>目前沒有符合條件的待辦事項。</p>
        <div id="todoFeedback" class="todo-feedback" role="status" aria-live="polite" hidden>
          <span id="todoFeedbackText"></span>
        </div>
        <p id="todoError" class="todo-error" role="alert" hidden></p>
      </div>
    </section>

    <section class="todo-panel todo-history-panel" aria-labelledby="todoHistoryTitle">
      <div class="todo-panel-head">
        <div>
          <h2 id="todoHistoryTitle">最近處理</h2>
          <p>完成或跳過的項目可在 3 天內復原；超過 72 小時會自動從此清單移除。</p>
        </div>
        <strong id="todoHistoryCount">0 項可復原</strong>
      </div>
      <div class="todo-panel-body">
        <div id="todoHistoryList" class="todo-history-list"></div>
        <p id="todoHistoryEmpty" class="todo-empty">目前沒有可復原的項目。</p>
      </div>
    </section>
  </main>
  <script type="module" src="/src/todo-page.ts"></script>
</body>
</html>
