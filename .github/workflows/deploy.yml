name: Validate and release Tracker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A Supabase release changes persistent state. Never cancel a migration or
# function deployment because a newer commit was pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.116.0

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check Supabase Edge Functions
        run: npm run typecheck:edge

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
        env:
          # OAuth client IDs are public identifiers. Configure this as the
          # repository variable VITE_GOOGLE_CLIENT_ID (a secret also works).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

  deploy_supabase:
    name: Deploy Supabase database and functions
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: supabase-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID_OVERRIDE: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || missing+=(SUPABASE_ACCESS_TOKEN)
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=(SUPABASE_DB_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secret(s): ${missing[*]}. Add them under Settings > Secrets and variables > Actions before releasing."
            exit 1
          fi

          project_id="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([a-z0-9]+)"[[:space:]]*$/\1/p' supabase/config.toml | head -n 1)"
          if [[ ! "${project_id}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::supabase/config.toml must contain one valid 20-character project_id."
            exit 1
          fi

          if [[ -n "${SUPABASE_PROJECT_ID_OVERRIDE:-}" && "${SUPABASE_PROJECT_ID_OVERRIDE}" != "${project_id}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID does not match supabase/config.toml. Release stopped to prevent deployment to the wrong project."
            exit 1
          fi

          echo "SUPABASE_PROJECT_ID=${project_id}" >> "${GITHUB_ENV}"

      # Pin both the Action revision and CLI version so a third-party update
      # cannot silently change the production deployment toolchain.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(supabase --version)"
          if [[ "${actual_version}" != "${SUPABASE_CLI_VERSION}" ]]; then
            echo "::error::Expected Supabase CLI ${SUPABASE_CLI_VERSION}, received ${actual_version}."
            exit 1
          fi

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Deploy database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      - name: Deploy google-calendar function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy google-calendar --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy google-calendar-callback function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy google-calendar-callback --project-ref "$SUPABASE_PROJECT_ID"

      - name: Smoke-test deployed functions
        shell: bash
        run: |
          set -euo pipefail

          smoke_check() {
            local name="$1"
            local url="$2"
            local expected_status="$3"
            local expected_text="$4"
            local response_file
            response_file="$(mktemp)"

            for attempt in 1 2 3 4 5; do
              status="$(curl --silent --show-error --connect-timeout 15 --max-time 30 --output "${response_file}" --write-out '%{http_code}' "${url}" || true)"
              if [[ "${status}" == "${expected_status}" ]] && grep --fixed-strings --quiet "${expected_text}" "${response_file}"; then
                rm -f "${response_file}"
                echo "${name} smoke check passed."
                return 0
              fi
              sleep 3
            done

            rm -f "${response_file}"
            echo "::error::${name} did not return the expected deployed response (HTTP ${expected_status})."
            return 1
          }

          base_url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"
          smoke_check "google-calendar" "${base_url}/google-calendar" 405 'POST required'
          smoke_check "google-calendar-callback" "${base_url}/google-calendar-callback" 400 '<!doctype html>'

  deploy:
    name: Deploy GitHub Pages
    needs: deploy_supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
